name: Local connector tests
on:
  pull_request:
    paths: ['local_connector/**', '.github/workflows/local-connector.yml']
  push:
    branches: [local-connector-readonly]
    paths: ['local_connector/**', '.github/workflows/local-connector.yml']
jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s local_connector -v
      - run: docker build -t smart-ev-connector-test local_connector
