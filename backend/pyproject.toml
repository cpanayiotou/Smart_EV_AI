[project]
name = "smart-ev-ai"
version = "0.1.0"
description = "Local-first AI energy manager for evcc"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
