services:
  smart-ev-connector:
    build: .
    container_name: smart-ev-connector
    network_mode: host
    environment:
      EVCC_URL: http://127.0.0.1:7070
      # Default is safe for SSH tunnelling. For trusted LAN access, set the Pi's fixed LAN IP.
      CONNECTOR_HOST: ${CONNECTOR_HOST:-127.0.0.1}
      CONNECTOR_PORT: "7080"
      CONNECTOR_DATA_DIR: /data
      EVCC_TIMEOUT_SECONDS: "5"
    volumes:
      - connector-data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  connector-data:
