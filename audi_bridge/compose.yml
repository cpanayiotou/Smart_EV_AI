name: smart-ev-audi
services:
  audi-bridge:
    build: .
    container_name: smart-ev-audi-bridge
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - audi-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:7081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  audi-data:
